<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Dual SSH</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd;
                 font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px;
               background: #252526; border-bottom: 1px solid #3a3a3a; font-size: 13px; }
    #toolbar .spacer { flex: 1; }
    #count { color: #999; }
    #grid { flex: 1; min-height: 0; display: grid; gap: 4px; background: #3a3a3a; }
    #grid.three .pane:nth-child(3) { grid-column: 1 / span 2; }
    #empty { display: none; flex: 1; align-items: center; justify-content: center; color: #999; }
    .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #1e1e1e; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #2d2d2d;
           font: 12px ui-monospace, Menlo, Consolas, monospace; }
    .bar .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex: 0 0 9px; }
    .dot.connected { background: #3fb950; }
    .dot.connecting { background: #d29922; }
    .dot.error, .dot.closed { background: #f85149; }
    .state { color: #999; }
    button { background: #3a3a3a; color: #ddd; border: 1px solid #555; border-radius: 4px;
             padding: 2px 8px; cursor: pointer; font: inherit; }
    button:hover:not(:disabled) { background: #4a4a4a; }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: #0e639c; border-color: #1177bb; }
    button.danger:hover { background: #7a2b2b; }
    .term { flex: 1; min-height: 0; padding: 4px; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
             align-items: center; justify-content: center; z-index: 10; }
    #modal.open { display: flex; }
    #form { background: #2d2d2d; border: 1px solid #555; border-radius: 8px; padding: 18px 20px;
            width: 340px; display: grid; gap: 10px; }
    #form h3 { margin: 0 0 4px; font-size: 15px; }
    #form label { display: grid; gap: 3px; font-size: 12px; color: #aaa; }
    #form input { background: #1e1e1e; color: #ddd; border: 1px solid #555; border-radius: 4px;
                  padding: 6px 8px; font: 13px ui-monospace, Menlo, Consolas, monospace; }
    #form .row { display: grid; grid-template-columns: 1fr 80px; gap: 8px; }
    #form .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    #formError { color: #f85149; font-size: 12px; min-height: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <strong>Dual SSH</strong>
      <span id="count"></span>
      <span class="spacer"></span>
      <button id="add" class="primary">+ Add server</button>
    </div>
    <div id="grid"></div>
    <div id="empty">No servers yet. Click "+ Add server".</div>
  </div>

  <div id="modal">
    <form id="form" autocomplete="off">
      <h3 id="formTitle">Server</h3>
      <label>Name<input id="fName" /></label>
      <div class="row">
        <label>Host / IP<input id="fHost" /></label>
        <label>Port<input id="fPort" inputmode="numeric" /></label>
      </div>
      <label>Username<input id="fUser" /></label>
      <label>Password<input id="fPass" type="password" /></label>
      <div id="formError"></div>
      <div class="actions">
        <button type="button" id="fCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
