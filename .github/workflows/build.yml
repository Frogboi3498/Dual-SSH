name: Build and Release App

on:
  push:
    tags: ['v*'] # Triggers automatically when you push a tag like v1.0.0

permissions:
  contents: write # Crucial: Allows Actions to create a draft release and upload binaries

jobs:
  release:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Compile and Ship to GitHub Releases
        # This will execute the dist scripts we updated in step 1
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            npm run dist:mac
          else
            npm run dist:win
          }
        shell: bash
        env:
          # Passes authentication context allowing electron-builder to upload directly
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
